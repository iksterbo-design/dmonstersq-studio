name: Build Android APK

# Two independent builds, both in the cloud (no local Java/SDK needed):
#   * gradle-apk -> the real F-Droid-style Android project (installable debug APK)
#   * twa-apk    -> a Trusted Web Activity generated from the hosted PWA
# Trigger manually (Actions tab -> Run workflow) or on a version tag.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  # ------------------------------------------------------------- native shell
  gradle-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK is preinstalled on ubuntu-latest; we only add what the
      # build needs. The legacy `tools` package was removed from the SDK
      # repository, and asking sdkmanager for it makes it exit non-zero.
      - name: Install Android platforms + build-tools
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then
            echo "no sdkmanager found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Sync the web bundle into the Android project
        run: python3 sync_android_assets.py

      - name: Decode release signing keystore (if configured)
        env:
          KS_B64: ${{ secrets.DMQ_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DMQ_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DMQ_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.DMQ_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dmq-release.jks"
            {
              echo "DMQ_KEYSTORE=$RUNNER_TEMP/dmq-release.jks"
              echo "DMQ_STORE_PASSWORD=$KS_PASS"
              echo "DMQ_KEY_ALIAS=$KS_ALIAS"
              echo "DMQ_KEY_PASSWORD=$KS_KEYPASS"
            } >> "$GITHUB_ENV"
            echo "Signing: ENABLED (secrets found)"
          else
            echo "Signing: DISABLED - release APK will be unsigned (F-Droid style)"
          fi

      - name: Build debug APK (debug-signed, directly installable)
        run: cd android && gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned, for F-Droid / your own signing)
        run: cd android && gradle assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dmq-studio-apk
          if-no-files-found: warn
          path: android/app/build/outputs/apk/**/*.apk

      - name: Publish APK for one-tap download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No debug APK found - skipping release."; exit 0; fi
          cp "$APK" ./DMQ-Studio.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ./DMQ-Studio.apk --clobber
          else
            gh release create latest \
              --title "D MONSTERS Q STUDIO - Android APK" \
              --notes "Auto-built from ${{ github.sha }}" \
              --target main
            gh release upload latest ./DMQ-Studio.apk --clobber
          fi
          echo "### :inbox_tray: One-tap Android download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/latest/download/DMQ-Studio.apk" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------- TWA from PWA
  # Best effort: Bubblewrap is archived upstream, so a failure here must never
  # block the real APK above.
  twa-apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platforms + build-tools
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point twa-manifest at this repo's Pages URL
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          node -e '
            const fs=require("fs");
            const f="twa-manifest.json";
            const m=JSON.parse(fs.readFileSync(f,"utf8"));
            const base=`https://${process.env.OWNER}.github.io/${process.env.REPO}`;
            m.host=`${process.env.OWNER}.github.io`;
            m.startUrl=`/${process.env.REPO}/index.html`;
            m.webManifestUrl=`${base}/manifest.webmanifest`;
            m.fullScopeUrl=`${base}/`;
            m.iconUrl=`${base}/icons/icon-512.png`;
            m.maskableIconUrl=`${base}/icons/icon-maskable-512.png`;
            fs.writeFileSync(f, JSON.stringify(m,null,2));
          '
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore android.keystore \
            -alias dmq -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass dmqstudio -keypass dmqstudio \
            -dname "CN=DMQ Studio, OU=App, O=DMonstersQ, L=NA, S=NA, C=US"

      - name: Build TWA APK
        run: bubblewrap build --skipPwaValidation
        continue-on-error: true

      - name: Upload TWA APK
        uses: actions/upload-artifact@v4
        with:
          name: dmq-studio-twa-apk
          if-no-files-found: warn
          path: '*.apk'
